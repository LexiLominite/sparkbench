<main id="content" tabindex="-1"><div class="loading"><h1>Loading measurements</h1><p>Reading the published benchmark archive.</p></div></main>
<footer><span id="footer-meta">Single-machine measurements. Speed does not measure answer quality.</span><span><a href="https://github.com/LexiLominite/sparkbench" target="_blank" rel="noopener">Source &amp; protocol</a> &nbsp; / &nbsp; <a href="https://lexilominite.com" target="_blank" rel="noopener">LexiLominite</a></span></footer>
<div id="tray" class="selection-tray" hidden><span id="tray-count"></span><a id="compare-link" class="button primary" href="#compare">Compare models</a><button id="clear-selection" class="quiet">Clear<span class="clear-word"> selection</span></button></div><div class="toast" id="toast" role="status" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('en',{maximumFractionDigits:0});
const fmt=(v,d=1)=>typeof v==='number'&&Number.isFinite(v)?v.toLocaleString('en',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const val=(v,unit='',d=1)=>v==null?'Not recorded':`${fmt(v,d)}${unit?' '+unit:''}`;
let DATA,SUM,WORK,models=[],state={workload:'writing',query:'',engine:'all',sort:'speed',group:true},selected=new Set(),toastTimer;
const metricKeys=['decode_tps','ttft_s','prefill_tps','end_to_end_tps'];
function notify(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3600)}
function rawModel(s){return DATA.runs.flatMap(r=>r.models||[]).find(m=>m.name===s.model&&m.engine===s.engine)}
function median(a){if(!a.length)return null;const b=a.slice().sort((x,y)=>x-y);return b.length%2?b[(b.length-1)/2]:(b[b.length/2-1]+b[b.length/2])/2}
function stats(a){a=a.filter(x=>typeof x==='number'&&Number.isFinite(x));return a.length?{median:median(a),min:Math.min(...a),max:Math.max(...a)}:{median:null}}
function groupKey(m){return `${m.engine}:${m.raw?.digest||m.manifest_digest||m.id}`}
function representative(list){return list.find(m=>!m.model.includes(':')||!['default','coder','vision','reasoning','fast','agent'].includes(m.model.split(':')[0]))||list[0]}
function displayParameters(v){const n=Number(v);return Number.isFinite(n)&&n>=1000000?`${fmt(n/(n>=1e9?1e9:1e6),2)}${n>=1e9?'B':'M'}`:v}
function latestAttempt(m,w=state.workload){return (WORK.results||[]).filter(r=>r.workload===w&&(r.model_id===m.id||r.model_name===m.model)&&r.engine===m.engine).sort((a,b)=>String(b.provenance?.measured_at||'').localeCompare(String(a.provenance?.measured_at||'')))[0]}
function buildModels(){models=SUM.models.map((m,i)=>{const raw=rawModel(m);return {...m,id:raw?.id||String(i),raw,kind:m.kind||raw?.kind||'generation',quant:m.quantization_metadata||raw?.quantization||'Unknown',params:displayParameters(m.parameter_size||raw?.parameters||'Unknown'),active:m.active_parameters||null}})}
function measurements(m,workload=state.workload){if(workload==='writing')return m.status==='ok'&&m.kind==='generation'?[{workload:'writing',trial_count:m.trial_count,metrics:Object.fromEntries(metricKeys.map(k=>[k,m[k]||{median:null}])),protocol:{id:'sparkbench-essay-v1',prompt_family:'Shared essay prompt',sampling:'Temperature 0; thinking requested off; concurrency 1',timing_basis:m.decode_measurement,notes:[]},provenance:{source:'SparkBench three-trial baseline',measured_at:m.raw?.history?.[0]?.observed_utc}}]:[];return (WORK.results||[]).filter(r=>r.status==='ok'&&r.workload===workload&&(r.model_id===m.id||r.model_name===m.model)&&(!r.engine||r.engine===m.engine))}
function measurement(m,w=state.workload){return measurements(m,w).slice().sort((a,b)=>Number(b.preferred===true)-Number(a.preferred===true)||String(b.provenance?.measured_at||'').localeCompare(String(a.provenance?.measured_at||'')))[0]||null}
function groups(){const arr=models.filter(m=>m.kind==='generation');if(!state.group)return arr.map(m=>({...m,aliases:[m]}));const map=new Map();for(const m of arr){const key=groupKey(m);if(!map.has(key))map.set(key,[]);map.get(key).push(m)}return [...map.values()].map(a=>({...representative(a),aliases:a}))}
function filterModels(){const q=state.query.toLowerCase();const a=groups().filter(m=>(state.engine==='all'||m.engine===state.engine)&&(!q||m.aliases.some(x=>`${x.model} ${x.engine} ${x.quant} ${x.params}`.toLowerCase().includes(q))));return a.sort((a,b)=>{const av=measurement(a),bv=measurement(b);const x=state.sort==='ttft'?av?.metrics.ttft_s?.median:state.sort==='memory'?a.loaded_allocated_gib:av?.metrics.decode_tps?.median;const y=state.sort==='ttft'?bv?.metrics.ttft_s?.median:state.sort==='memory'?b.loaded_allocated_gib:bv?.metrics.decode_tps?.median;if(state.sort==='name')return a.model.localeCompare(b.model);return (x==null)-(y==null)||(state.sort==='speed'?(y??0)-(x??0):(x??0)-(y??0))||a.model.localeCompare(b.model)})}
function profileFor(m){const p=SUM.protocol.engine_profiles||{};if(m.engine==='TensorFold')return p.TensorFold||{};if(m.engine==='Ollama')return p.Ollama||{};if(m.model==='Qwen3.8-27B-Uncensored')return p.existing_FP8_vLLM||{};return p.additional_vLLM_and_Qwen_BF16||{}}
function modelURL(m,w=state.workload){return `#model/${encodeURIComponent(m.id)}?workload=${w}`}
function workloadControls(){return `<div class="workload-bar"><div><div class="workload-label">What will you run?</div><div class="segments" role="group" aria-label="Benchmark workload">${['writing','coding','chat'].map(w=>`<button data-workload="${w}" aria-pressed="${w===state.workload}">${w[0].toUpperCase()+w.slice(1)}</button>`).join('')}</div></div><div class="workload-explain">${state.workload==='writing'?'The shared essay benchmark. Median of three short trials after warmup, one request at a time. Explore output speed alongside first-token latency.':state.workload==='coding'?'Code-generation throughput from dedicated coding prompts. Coverage is growing; each measurement keeps its own sampling and timing protocol.':'Chat-generation throughput from dedicated conversational prompts. Sampled chat and deterministic writing can have different generation speeds.'}</div></div>`}
function workloadNote(){return state.workload==='writing'?`<div class="notice">Output speed is generated tokens per second. Engine timing, model tokenizers and server settings differ. GPT-OSS generated reasoning despite thinking being requested off. <a href="#method">Read the comparison limits</a>.</div>`:`<div class="notice warning">Dedicated workload tests use their own prompts and sampling. Prefer results from the same protocol when comparing models. Archival secondary results retain their separate labels; missing results mean no measurement has been published. These speed tests do not score coding or answer quality.</div>`}
function bindWorkload(){document.querySelectorAll('[data-workload]').forEach(b=>b.onclick=()=>{state.workload=b.dataset.workload;const route=location.hash.startsWith('#model/')?location.hash.split('?')[0]:location.hash.startsWith('#compare')?'#compare':'#models';location.hash=`${route}?workload=${state.workload}${route==='#compare'&&selected.size?'&models='+[...selected].join(','):''}`})}
function row(m,max){const r=measurement(m),speed=r?.metrics.decode_tps?.median,ttft=r?.metrics.ttft_s?.median,prefill=r?.metrics.prefill_tps?.median;const n=m.aliases.length;return `<tr><td class="select"><input type="checkbox" data-select="${esc(m.id)}" aria-label="Compare ${esc(m.model)}" ${selected.has(m.id)?'checked':''}></td><td><a class="model-name" href="${modelURL(m)}">${esc(m.model)}</a><div class="model-sub">${esc(m.params)}${m.active?' / '+esc(m.active)+' active':''} &nbsp; ${esc(m.quant)}</div>${n>1?`<details class="aliases"><summary>${n} tags share these weights</summary><p>${m.aliases.map(a=>`<a href="${modelURL(a)}">${esc(a.model)}</a>`).join('<br>')}</p></details>`:''}${m.status!=='ok'?'<span class="badge warning">Incomplete</span>':''}${state.workload!=='writing'&&r?`<span class="badge ${r.preferred?'':'secondary'}">${r.preferred?'Dedicated workload':'Secondary measurement'}</span>`:''}</td><td><span class="badge">${esc(m.engine)}</span><div class="model-sub">${esc(m.format||m.raw?.format||'Unknown')}</div></td><td class="right num">${speed==null?'<span class="muted small">Not measured</span>':`<div class="speed">${fmt(speed)}</div><div class="bar" aria-hidden="true"><span style="width:${Math.max(2,speed/max*100)}%"></span></div>`}</td><td class="right num no-wrap">${fmt(ttft,3)}${ttft!=null?' s':''}</td><td class="right num">${fmt(prefill,0)}</td><td class="right num">${r?(r.trial_count??'<span class="small muted">Unknown</span>'):'—'}</td></tr>`}
function renderResults(){const arr=filterModels();const recorded=arr.filter(m=>measurement(m)).length;const max=Math.max(1,...arr.map(m=>measurement(m)?.metrics.decode_tps?.median||0));$('#results').innerHTML=`<div class="coverage"><span><span class="dot"></span><strong>${recorded} of ${arr.length}</strong> visible ${state.group?'weight groups':'model tags'} measured</span><span>${[...new Set(models.map(m=>m.engine))].length} inference engines</span><span>Static snapshot, not a live server</span></div><div class="table-wrap"><table><caption class="skip">${state.workload} throughput on DGX Spark</caption><thead><tr><th aria-label="Compare selection"></th><th>Model / weights</th><th>Engine / format</th><th class="right">Output tok/s</th><th class="right">First token</th><th class="right">Prefill tok/s</th><th class="right">Trials</th></tr></thead><tbody>${arr.length?arr.map(m=>row(m,max)).join(''):`<tr><td colspan="7"><div class="empty"><h3>No models match these filters</h3><p>Try another model name or inference engine.</p><button id="reset-filters">Reset filters</button></div></td></tr>`}</tbody></table></div><div class="table-foot"><span>${state.group?'Tags with matching engine and weight digest are grouped; open a group to inspect every tag.':'Every installed tag is shown, including shared-weight aliases.'}</span><span>Missing metrics are shown as —.</span></div>${!recorded?'<div class="empty"><h3>No published measurements for this selection</h3><p>Switch to Writing for the shared benchmark, or clear filters to find any available workload results.</p><button data-workload="writing">Show writing benchmark</button></div>':''}`;document.querySelectorAll('[data-select]').forEach(b=>b.addEventListener('change',()=>toggleSelection(b.dataset.select,b.checked)));$('#reset-filters')?.addEventListener('click',()=>{state.query='';state.engine='all';render()});bindWorkload();updateTray()}
function renderModels(){const engines=[...new Set(models.map(m=>m.engine))];$('#content').innerHTML=`<div class="intro"><div><h1>Choose a model for your workload.</h1><p class="lede">Measured inference speed on one NVIDIA DGX Spark. Start with a task, compare the numbers, then inspect the setup behind them.</p></div><div class="intro-actions"><button id="reload" class="quiet">Reload data</button><button id="download-csv">Export CSV</button></div></div>${workloadControls()}${workloadNote()}<div class="toolbar"><label class="field search">Search models<input id="search" type="search" value="${esc(state.query)}" placeholder="Name, quantization or parameters…"></label><label class="field">Inference engine<select id="engine"><option value="all">All engines</option>${engines.map(e=>`<option ${state.engine===e?'selected':''}>${esc(e)}</option>`).join('')}</select></label><label class="field">Sort by<select id="sort"><option value="speed" ${state.sort==='speed'?'selected':''}>Output speed</option><option value="ttft" ${state.sort==='ttft'?'selected':''}>First token</option><option value="memory" ${state.sort==='memory'?'selected':''}>Loaded allocation</option><option value="name" ${state.sort==='name'?'selected':''}>Model name</option></select></label><label class="checklabel"><input id="group" type="checkbox" ${state.group?'checked':''}>Group shared weights</label></div>${WORK.suite?.status==='in_progress'?`<p class="small muted">The expanded coding/chat suite is in progress. This snapshot contains ${WORK.suite.successful_workload_profiles} completed workload profiles; additional models will appear after their results are verified.</p>`:''}<div id="results"></div><div class="section"><details class="panel"><summary>Embedding models (${models.filter(m=>m.kind==='embedding').length})</summary><div>${embeddingTable()}</div></details><details class="panel"><summary>Understanding these numbers</summary><div><div class="two-col"><div><h3>Output speed and first token</h3><p class="small muted">Output speed measures generation after prefill. First token includes prompt processing and request overhead. Lower first-token latency feels more immediate; higher output speed keeps long responses flowing.</p></div><div><h3>Memory and quality</h3><p class="small muted">The model detail includes loaded allocation and host memory, where available. Higher throughput does not establish better answers, better code or better tool use. This archive measures speed.</p></div></div><a href="#method">Open the complete measurement protocol</a></div></details></div>`;$('#search').addEventListener('input',e=>{state.query=e.target.value;renderResults()});$('#engine').addEventListener('change',e=>{state.engine=e.target.value;renderResults()});$('#sort').addEventListener('change',e=>{state.sort=e.target.value;renderResults()});$('#group').addEventListener('change',e=>{state.group=e.target.checked;renderResults()});$('#reload').addEventListener('click',()=>load(true));$('#download-csv').addEventListener('click',exportCSV);renderResults()}
function embeddingTable(){const a=models.filter(m=>m.kind==='embedding');return `<p class="small muted">Embedding throughput counts input tokens per wall second. It does not measure text generation or output quality.</p><div class="table-wrap"><table><thead><tr><th>Model</th><th>Engine</th><th class="right">Input tok/s</th><th class="right">Wall time</th><th class="right">Dimensions</th></tr></thead><tbody>${a.map(m=>`<tr><td><a href="${modelURL(m)}">${esc(m.model)}</a></td><td>${esc(m.engine)}</td><td class="right num">${fmt(m.input_tps_wall?.median)}</td><td class="right num">${fmt(m.wall_s?.median,3)} s</td><td class="right">${esc(m.dimensions?.join(', ')||'—')}</td></tr>`).join('')}</tbody></table></div>`}
function specs(rows){return `<dl class="specs">${rows.map(([l,v])=>`<dt>${esc(l)}</dt><dd>${esc(v??'Not recorded')}</dd>`).join('')}</dl>`}
function metricsHTML(m,r){const metrics=r?.metrics||{};const a=m.kind==='embedding'?[['Input throughput',m.input_tps_wall?.median,'tok/s'],['Wall time',m.wall_s?.median,'s'],['Load time',m.load_s,'s'],['Loaded allocation',m.loaded_allocated_gib,'GiB']]:[['Output speed',metrics.decode_tps?.median,'tok/s'],['First token',metrics.ttft_s?.median,'s'],['Prefill speed',metrics.prefill_tps?.median,'tok/s'],['End-to-end speed',metrics.end_to_end_tps?.median,'tok/s']];return `<div class="metric-strip">${a.map(([label,v,u])=>`<div class="metric"><div class="metric-label">${label}</div><div class="metric-value num">${fmt(v,u==='s'?3:1)} <span class="small muted">${v==null?'':u}</span></div><div class="metric-note">${v==null?'Not recorded for this workload':'Median'+(r?.trial_count?' of '+r.trial_count+' measured trials':'; trial count unavailable')}</div></div>`).join('')}</div>`}
function trialTable(m){const a=m.raw?.trials||[];return `<p class="small muted">Warmup is excluded from ranked medians. Per-trial prompt hashes and timing details are retained in the JSON archive; prompt and response text are omitted.</p><div class="table-wrap"><table><thead><tr><th>Trial</th><th class="right">Input tokens</th><th class="right">Output tokens</th><th class="right">Output tok/s</th><th class="right">First token s</th><th class="right">Prefill tok/s</th><th class="right">Wall time s</th></tr></thead><tbody>${a.map(t=>`<tr><td>${t.phase==='warmup'?'<span class="muted">Warmup (excluded)</span>':'Trial '+esc(t.trial)}</td><td class="right num">${fmt(t.input_tokens,0)}</td><td class="right num">${fmt(t.output_tokens,0)}</td><td class="right num">${fmt(t.decode_tps,2)}</td><td class="right num">${fmt(t.ttft_s,3)}</td><td class="right num">${fmt(t.prefill_tps,0)}</td><td class="right num">${fmt(t.wall_s,3)}</td></tr>`).join('')}</tbody></table></div>`}
function modelSpecs(m){const raw=m.raw||{},meta=raw.metadata||{},cp=meta.checkpoint||{},p=profileFor(m),server=meta.server||{};return specs([['Inference engine',m.engine+' '+(server.tensorfold_version||p.version||'')],['Weight format',m.format||raw.format],['Quantization',m.quant],['Total parameters',m.params],['Active parameters',m.active],['Checkpoint',cp.repo_id||p.checkpoint],['Revision / digest',cp.revision||m.manifest_digest||raw.digest],['Disk footprint',val(m.tag_disk_gib,'GiB')],['Maximum context',server.context_tokens||p.maximum_context||p.requested_context],['KV cache',server.kv_dtype||p.kv_cache_dtype],['Server slots',server.parallel_slots||p.server_parallel_slots||p.maximum_sequences],['Benchmark concurrency',server.request_concurrency||1],['MTP drafting',server.mtp_drafts||p.mtp_drafts?`${server.mtp_drafts||p.mtp_drafts} drafts; confidence ${server.mtp_confidence||p.mtp_confidence}`:'Not recorded / not configured'],['Flash attention',p.flash_attention==null?null:String(p.flash_attention)]])}
function resourceSpecs(m){const r=m.resources||{};return specs([['Loaded allocation',val(m.loaded_allocated_gib,'GiB')],['Loaded GPU allocation',val(m.loaded_gpu_allocated_gib,'GiB')],['Host peak unavailable',val(r.host_peak_unavailable_gib,'GiB')],['Peak GPU temperature',val(r.gpu_temperature_max_c,'°C',0)],['Mean GPU power',val(r.gpu_power_mean_w,'W')],['Peak GPU power',val(r.gpu_power_max_w,'W')],['Mean GPU utilization',val(r.gpu_util_mean_percent,'%')],['Resource samples',r.sample_count],['Engine load duration',val(m.load_s,'s',3)],['Startup to ready',val(m.startup_to_ready_s||m.raw?.metadata?.result?.startup_to_ready_s,'s',1)]])}
function rangeTable(r){return `<div class="table-wrap"><table><thead><tr><th>Metric</th><th class="right">Median</th><th class="right">Min</th><th class="right">Max</th><th class="right">Sample SD</th><th class="right">Variation %</th></tr></thead><tbody>${[['Output tok/s','decode_tps'],['First token s','ttft_s'],['Prefill tok/s','prefill_tps'],['End-to-end tok/s','end_to_end_tps']].map(([label,k])=>{const s=r?.metrics?.[k]||{};const d=k==='ttft_s'?3:2;return `<tr><td>${label}</td><td class="right num">${fmt(s.median,d)}</td><td class="right num">${fmt(s.min,d)}</td><td class="right num">${fmt(s.max,d)}</td><td class="right num">${fmt(s.sample_sd,d)}</td><td class="right num">${fmt(s.cv_percent,2)}</td></tr>`}).join('')}</tbody></table></div><p class="small muted" style="margin-top:12px">Three short repetitions describe this sample; they do not establish a confidence interval or sustained thermal stability.</p>`}
function protocolHTML(r,m){const p=r?.protocol||{};const meta=m.raw?.metadata||{};return specs([['Workload',r?.workload||state.workload],['Prompt family',p.prompt_family],['Trial count',r?.trial_count],['Sampling',typeof p.sampling==='object'?JSON.stringify(p.sampling):p.sampling],['Configured context for this workload',p.context_tokens],['Temperature',p.temperature],['Seed',p.seed],['Thinking',p.thinking===false?'Requested off':p.thinking],['Concurrency',p.concurrency],['Timing basis',p.timing_basis||m.decode_measurement],['Source',r?.provenance?.source],['Measured at',r?.provenance?.measured_at],['Protocol match',state.workload==='writing'?meta.protocol_match:null],['Notes',Array.isArray(p.notes)?p.notes.join(' '):p.notes]])}
function workloadTrialTable(r){const a=[...(r.warmup?[{...r.warmup,phase:'warmup'}]:[]),...(r.trials||[])];return `<p class="small muted">These trials belong to the selected workload. Warmup is excluded from its median. Engine-generated reasoning is included when present.</p><div class="table-wrap"><table><thead><tr><th>Trial</th><th class="right">Input tokens</th><th class="right">Output tokens</th><th class="right">Output tok/s</th><th class="right">First token s</th><th class="right">Prefill tok/s</th><th class="right">Wall s</th></tr></thead><tbody>${a.map(t=>`<tr><td>${t.phase==='warmup'?'Warmup (excluded)':'Trial '+esc(t.trial)}</td><td class="right num">${fmt(t.prompt_tokens??t.input_tokens,0)}</td><td class="right num">${fmt(t.output_tokens,0)}</td><td class="right num">${fmt(t.decode_tps,2)}</td><td class="right num">${fmt(t.ttft_s,3)}</td><td class="right num">${fmt(t.prefill_tps,0)}</td><td class="right num">${fmt(t.wall_s,3)}</td></tr>`).join('')}</tbody></table></div>`}
function workloadResources(r){const a=(r.trials||[]).map(t=>t.resource_after).filter(Boolean);if(!a.length)return '';const values=k=>a.map(x=>x[k]).filter(x=>Number.isFinite(x));const maximum=k=>values(k).length?Math.max(...values(k)):null;const average=k=>values(k).length?values(k).reduce((s,x)=>s+x,0)/values(k).length:null;const available=values('memory_available_kib');return `<div class="section"><h2>Selected workload resource samples</h2>${specs([['Sample count',a.length],['Maximum GPU temperature',val(maximum('gpu_temperature_c'),'°C',0)],['Mean sampled GPU power',val(average('gpu_power_w'),'W')],['Maximum sampled GPU power',val(maximum('gpu_power_w'),'W')],['Mean GPU utilization',val(average('gpu_utilization_percent'),'%')],['Minimum available host memory',val(available.length?Math.min(...available)/1024/1024:null,'GiB')]])}<p class="small muted">Samples were taken immediately after each measured request. Available host memory includes all processes; sampled board power is not wall power or total energy.</p></div>`}
function renderDetail(id){const m=models.find(m=>m.id===id);if(!m){$('#content').innerHTML='<div class="empty"><h1>Model not found</h1><p>This link may point to an older snapshot.</p><a class="button" href="#models">Browse models</a></div>';return}const r=measurement(m),meta=m.raw?.metadata||{};const aliases=models.filter(a=>groupKey(a)===groupKey(m));$('#content').innerHTML=`<a class="back" href="#models?workload=${state.workload}">‹ All models</a><div class="intro"><div><h1 class="detail-title">${esc(m.model)}</h1><p class="lede">${esc(m.engine)} / ${esc(m.params)}${m.active?' / '+esc(m.active)+' active':''} / ${esc(m.quant)}</p></div><div class="intro-actions"><button id="detail-select">${selected.has(m.id)?'Remove from comparison':'Add to comparison'}</button><button id="share">Copy link</button></div></div>${m.kind==='generation'?workloadControls():''}${m.status!=='ok'?`<div class="notice warning">This entry is incomplete. ${esc(m.raw?.error||'No successful generation measurement was published.')}</div>`:!r&&m.kind==='generation'?`<div class="notice warning">${latestAttempt(m)?.status==='error'||latestAttempt(m)?.status==='unavailable'?'The workload test could not produce a valid result. '+esc(latestAttempt(m).error||(latestAttempt(m).protocol?.notes||[]).join(' ')):state.workload[0].toUpperCase()+state.workload.slice(1)+' has not been measured for this model.'} Select another workload to inspect available results.</div>`:workloadNote()}${metricsHTML(m,r)}<div class="two-col"><div><h2>Weight &amp; original server profile</h2>${modelSpecs(m)}${meta.parameters_note?`<p class="small muted" style="margin-top:13px">${esc(meta.parameters_note)}</p>`:''}${aliases.length>1?`<details class="panel"><summary>Shared-weight tags (${aliases.length})</summary><div class="small">${aliases.map(a=>`<a href="${modelURL(a)}">${esc(a.model)}</a>`).join('<br>')}<p class="muted" style="margin-top:12px">These tags have the same recorded engine and weight digest. Their baseline trials remain individually available.</p></div></details>`:''}</div><div><h2>Writing baseline resources &amp; loading</h2>${resourceSpecs(m)}<p class="small muted" style="margin-top:13px">${esc(m.resources?.note||meta.resources_note||'Host unavailable memory includes the OS and background services. Resource samples are observations, not isolated model memory or full-run energy measurements.')}</p>${meta.result?.startup_note?`<p class="small muted">${esc(meta.result.startup_note)}</p>`:''}</div></div>${r?`<div class="section"><h2>Measurement protocol</h2>${protocolHTML(r,m)}${measurements(m).length>1?`<details class="panel"><summary>All archived measurements for this workload (${measurements(m).length})</summary><div>${measurements(m).map(a=>`<h3>${a.preferred?'Preferred dedicated measurement':'Archival measurement'}: ${fmt(a.metrics?.decode_tps?.median)} tok/s</h3>${protocolHTML(a,m)}`).join('')}</div></details>`:''}</div><details class="panel" open><summary>Statistics &amp; measured range</summary><div>${rangeTable(r)}</div></details>`:''}${r&&state.workload!=='writing'&&r.trials?.length?`<details class="panel"><summary>Selected workload trials &amp; warmup</summary><div>${workloadTrialTable(r)}</div></details>${workloadResources(r)}`:''}${state.workload==='writing'?`<details class="panel"><summary>Individual trials &amp; warmup</summary><div>${trialTable(m)}</div></details>`:''}<div class="section"><h2>Other workload measurements</h2><div class="table-wrap"><table><thead><tr><th>Workload</th><th class="right">Output tok/s</th><th class="right">First token</th><th>Measurement</th></tr></thead><tbody>${['writing','coding','chat'].map(w=>{const a=measurement(m,w);return `<tr><td><button class="inline" data-workload="${w}">${w[0].toUpperCase()+w.slice(1)}</button></td><td class="right num">${fmt(a?.metrics.decode_tps?.median)}</td><td class="right num">${fmt(a?.metrics.ttft_s?.median,3)}${a?.metrics.ttft_s?.median!=null?' s':''}</td><td class="small muted">${a?(w==='writing'?'Three-trial essay baseline':a.preferred?'Dedicated workload protocol':'Secondary; different prompt / sampling'):'Not measured'}</td></tr>`}).join('')}</tbody></table></div></div><p class="small muted" style="margin-top:20px">Speed does not measure answer quality. <a href="#method">Full protocol &amp; limits</a> · <a href="data.json" download>Download archive JSON</a> · <a href="#context">Long-context results</a></p>`;$('#detail-select').addEventListener('click',()=>{toggleSelection(m.id,!selected.has(m.id));render()});$('#share').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);notify('Model link copied')}catch{notify('Copy this page URL from your browser address bar')}});bindWorkload();updateTray()}
function toggleSelection(id,on){if(on&&selected.size>=4){notify('Compare up to four model entries at once');render();return}on?selected.add(id):selected.delete(id);updateTray()}
function updateTray(){const compare=location.hash.startsWith('#compare');$('#tray').hidden=!selected.size||compare;$('#tray-count').textContent=`${selected.size} model${selected.size===1?'':'s'} selected`;$('#compare-link').href=`#compare?workload=${state.workload}&models=${[...selected].join(',')}`}
function renderCompare(){const a=models.filter(m=>selected.has(m.id));$('#content').innerHTML=`<div class="intro"><div><h1>Compare model setups.</h1><p class="lede">Follow speed, latency and memory together. Compare the same workload and inspect timing differences before drawing conclusions.</p></div><div class="intro-actions"><a class="button" href="#models?workload=${state.workload}">Choose models</a>${a.length?'<button id="clear-compare">Clear comparison</button>':''}</div></div>${workloadControls()}${workloadNote()}${a.length?`<div class="table-wrap"><table class="compare-table"><thead><tr><th>Measurement</th>${a.map(m=>`<th><a class="model-name" href="${modelURL(m)}">${esc(m.model)}</a><button class="inline" data-remove="${m.id}">Remove</button></th>`).join('')}</tr></thead><tbody>${[['Output speed','decode_tps','tok/s',1],['First token','ttft_s','s',3],['Prefill speed','prefill_tps','tok/s',0],['End-to-end speed','end_to_end_tps','tok/s',1]].map(([l,k,u,d])=>`<tr><td>${l}</td>${a.map(m=>{const r=measurement(m),v=r?.metrics[k]?.median;return `<td class="num"><div class="compare-value">${fmt(v,d)} ${v==null?'':'<span class="small">'+u+'</span>'}</div><div class="compare-note">${v==null?'Not recorded':r.trial_count?r.trial_count+' trials':'Trial count unavailable'}</div>${r?.metrics[k]?.min!=null?`<div class="compare-note">Range ${fmt(r.metrics[k].min,d)}–${fmt(r.metrics[k].max,d)}</div>`:''}</td>`}).join('')}</tr>`).join('')}${[['Engine',m=>m.engine],['Format',m=>m.format||m.raw?.format],['Quantization',m=>m.quant],['Parameters',m=>m.params+(m.active?' / '+m.active+' active':'')],['Loaded allocation',m=>val(m.loaded_allocated_gib,'GiB')],['Host peak unavailable',m=>val(m.resources?.host_peak_unavailable_gib,'GiB')],['GPU temperature max',m=>val(m.resources?.gpu_temperature_max_c,'°C',0)],['GPU power mean',m=>val(m.resources?.gpu_power_mean_w,'W')],['Load duration',m=>val(m.load_s,'s',3)],['Startup to ready',m=>val(m.startup_to_ready_s||m.raw?.metadata?.result?.startup_to_ready_s,'s')],['Timing basis',m=>measurement(m)?.protocol?.timing_basis||m.decode_measurement],['Protocol',m=>measurement(m)?.protocol?.id||'Not measured']].map(([l,f])=>`<tr><td>${l}</td>${a.map(m=>`<td>${esc(f(m)||'Not recorded')}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted" style="margin-top:16px">Host memory includes background use. TensorFold resource samples are from a follow-up request. Load and startup durations use different timing windows; inspect each model detail.</p>`:'<div class="empty"><h2>Select models to begin</h2><p>Use the checkboxes on the Models page to choose up to four entries. Your comparison gets a shareable URL.</p><a class="button primary" href="#models">Browse models</a></div>'}`;$('#clear-compare')?.addEventListener('click',()=>{selected.clear();location.hash='#compare?workload='+state.workload;render()});document.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{selected.delete(b.dataset.remove);location.hash=`#compare?workload=${state.workload}&models=${[...selected].join(',')}`;render()}));bindWorkload();updateTray()}
function renderContext(){const rows=WORK.long_context||[];const max=Math.max(1,...rows.map(r=>r.prefill_tps||0));$('#content').innerHTML=`<div class="intro"><div><h1>How long prompts change the wait.</h1><p class="lede">Long-context prefill tests show how quickly a model reads a larger prompt before generating its first token.</p></div><a class="button" href="workloads.json" download>Download workload JSON</a></div><div class="notice warning">These secondary tests use different prompts from the writing baseline. Prefill throughput can include caching effects. A configured context limit does not establish tested context performance.</div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Model / engine</th><th class="right">Prompt tokens</th><th class="right">Prefill tok/s</th><th class="right">First token</th><th>Protocol</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.model_name)}<div class="model-sub">${esc(r.engine)}</div></td><td class="right num">${fmt(r.prompt_tokens,0)}</td><td class="right num"><div class="speed">${fmt(r.prefill_tps,0)}</div><div class="bar" aria-hidden="true"><span style="width:${r.prefill_tps/max*100}%"></span></div></td><td class="right num">${fmt(r.ttft_s,2)} s</td><td class="small muted">${esc(typeof r.protocol==='string'?r.protocol:r.protocol?.id||r.protocol?.prompt_family||'Secondary long-context test')}</td></tr>`).join('')}</tbody></table></div><div class="section text-column"><h2>What this tells you</h2><p class="muted">More prompt tokens usually add time before the first token. Prefill tokens per second describe prompt processing; they do not describe answer generation speed or recall accuracy over a long document.</p>${[...new Set(rows.map(r=>r.model_name))].map(name=>`<details class="panel"><summary>${esc(name)}: provenance &amp; test conditions</summary><div>${rows.filter(r=>r.model_name===name).slice(0,1).map(r=>specs([['Source',r.provenance?.source],['Measured at',r.provenance?.measured_at],['Protocol',typeof r.protocol==='string'?r.protocol:JSON.stringify(r.protocol)],['Measured prompt range',`${nf.format(Math.min(...rows.filter(r=>r.model_name===name).map(r=>r.prompt_tokens)))}–${nf.format(Math.max(...rows.filter(r=>r.model_name===name).map(r=>r.prompt_tokens)))} tokens`]])).join('')}</div></details>`).join('')}</div>`:'<div class="empty"><h2>No long-context results published yet</h2><p>Model context limits are available in each model detail. This view will show actual prompt-length measurements when they are added.</p><a class="button" href="#models">Browse model setups</a></div>'}`;updateTray()}
function renderMethod(){const p=SUM.protocol||{};$('#content').innerHTML=`<div class="intro"><div><h1>The measurement behind the number.</h1><p class="lede">A reproducible speed snapshot, with the limits kept visible. The archive contains model identities, timing statistics, warmup trials and resource observations.</p></div><div class="intro-actions"><a class="button" href="data.json" download>Archive JSON</a><a class="button" href="summary.json" download>Summary JSON</a><a class="button" href="workloads.json" download>Workloads JSON</a></div></div><div class="method-grid"><h2>Hardware snapshot</h2><div>${specs(Object.entries(SUM.hardware||{}).map(([k,v])=>[k.replaceAll('_',' '),v]))}</div></div><div class="method-grid"><h2>Writing baseline</h2><div><p>One warmup capped at ${esc(p.warmup_output_limit)} output tokens, followed by ${esc(p.measured_trials)} measured trials capped at ${esc(p.measured_output_limit)} tokens. The displayed number is the measured median; the warmup is excluded.</p>${specs([['Temperature',p.temperature],['Thinking',p.thinking===false?'Requested off':p.thinking],['Concurrency',p.concurrency],['Seed',p.seed],['Default requested context',p.context_tokens],['Sample limits',p.sample_limits],['Prompt caching',p.prompt_cache],['Token counting',p.generated_tokens]])}</div></div><div class="method-grid"><h2>Engine timing</h2><div>${Object.entries(p.decode_basis||{}).map(([engine,basis])=>`<div class="engine-profile"><strong>${esc(engine)}</strong><p>${esc(basis)}</p></div>`).join('')}<p>${esc(p.configuration_caveat)}</p><details class="panel"><summary>Complete engine profiles</summary><div>${Object.entries(p.engine_profiles||{}).map(([name,profile])=>`<h3 style="margin-top:15px">${esc(name.replaceAll('_',' '))}</h3>${specs(Object.entries(profile).map(([k,v])=>[k.replaceAll('_',' '),typeof v==='object'?JSON.stringify(v):v]))}`).join('')}</div></details></div></div><div class="method-grid"><h2>Coding &amp; chat</h2><div><p>Dedicated workload results are stored separately from the shared writing benchmark. Each result records model, inference engine, workload, metrics, protocol and source. The displayed speeds describe their own prompts and sampling; missing fields are shown as not recorded.</p><p>Archived Qwen3.8-Flash-Next coding and chat observations came from a separate prompt suite. New results marked Dedicated workload use the controlled coding/chat protocol: a 16-token warmup followed by three measured requests capped at 256 tokens, temperature 0, thinking requested off, and concurrency 1. Neither set replaces the original writing median. Alias labels such as “coder” identify an installed tag, not a measured coding workload.</p><p>These measurements do not test program correctness, pass rates, answer quality, vision or tool use.</p>${(WORK.profiles||[]).map(x=>`<h3>${esc(x.label)}</h3><p>${esc(x.description)}</p>`).join('')}</div></div><div class="method-grid"><h2>Load &amp; resources</h2><div><p>${esc(p.warmup_basis)}</p><p>${esc(p.load_caveat)}</p><p>Loaded allocation and host peak unavailable memory use different scopes. Host values include the OS and background services; they cannot be read as isolated model RAM. GPU power is sampled, not full-run energy. TensorFold power and temperature observations came from a follow-up generation, and its first-container startup included one-time kernel compilation.</p></div></div><div class="method-grid"><h2>Interpretation limits</h2><div><p>${esc(p.scope)}</p><p>Different tokenizers count text differently. A small fast model is not automatically a better coding model. Do not interpret the table order as a quality recommendation, and do not treat the engine timing formulas as interchangeable.</p><p>Matching weight digests are grouped within the same engine for browsing. Each alias retains its own measured trials and can be compared individually.</p></div></div><div class="method-grid"><h2>Data &amp; publication</h2><div><p>This is a static GitHub Pages snapshot. Reload fetches the published files again; it does not launch benchmarks. Prompt and answer text are omitted from the public archive.</p><p><a href="BENCHMARK.md">Read the stored benchmark protocol</a> · <a href="https://github.com/LexiLominite/sparkbench">Inspect repository history</a></p></div></div>`;updateTray()}
function route(){const hash=location.hash.slice(1)||'models';const [path,search='']=hash.split('?');const params=new URLSearchParams(search);if(['writing','coding','chat'].includes(params.get('workload')))state.workload=params.get('workload');if(path==='compare'&&params.has('models'))selected=new Set((params.get('models')||'').split(',').filter(id=>models.some(m=>m.id===id)).slice(0,4));return path}
function render(){const path=route();document.querySelectorAll('[data-nav]').forEach(a=>{a.removeAttribute('aria-current');if(a.dataset.nav===(path.startsWith('model/')?'models':path))a.setAttribute('aria-current','page')});if(path.startsWith('model/'))renderDetail(decodeURIComponent(path.slice(6)));else if(path==='compare')renderCompare();else if(path==='context')renderContext();else if(path==='method')renderMethod();else renderModels();document.title=(path.startsWith('model/')?models.find(m=>m.id===decodeURIComponent(path.slice(6)))?.model||'Model':path==='compare'?'Compare models':path==='context'?'Long context':path==='method'?'Measurement method':'Model performance')+' — SparkBench'}
function csvEscape(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function exportCSV(){const header=['model','engine','workload','quantization','format','parameters','status','trial_count','output_tps_median','ttft_s_median','prefill_tps_median','end_to_end_tps_median','timing_basis','protocol_id','source'];const rows=filterModels().map(m=>{const r=measurement(m);return [m.model,m.engine,state.workload,m.quant,m.format,m.params,m.status,r?.trial_count,...metricKeys.map(k=>r?.metrics[k]?.median),r?.protocol?.timing_basis||m.decode_measurement,r?.protocol?.id,r?.provenance?.source]});const blob=new Blob([[header,...rows].map(a=>a.map(csvEscape).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`sparkbench-${state.workload}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('CSV exported for the current workload and filters')}
async function load(reload=false){try{const suffix=reload?'?refresh='+Date.now():'';const responses=await Promise.all(['data.json','summary.json','workloads.json'].map(f=>fetch(f+suffix,{cache:reload?'reload':'default'})));if(!responses[0].ok||!responses[1].ok)throw new Error('Published data files could not be loaded.');[DATA,SUM]=await Promise.all(responses.slice(0,2).map(r=>r.json()));WORK=responses[2].ok?await responses[2].json():{results:[],long_context:[],profiles:[]};buildModels();const updated=WORK.updated_utc||DATA.archive_updated_utc;$('#header-meta').textContent='NVIDIA GB10 / '+(updated?new Date(updated).toLocaleDateString('en',{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'}):'Measured snapshot');$('#footer-meta').textContent=`${models.length} model tags archived. Speed does not measure answer quality.`;render();if(reload)notify('Published measurements reloaded')}catch(e){$('#content').innerHTML=`<div class="error"><h1>Measurements could not load.</h1><p class="muted">${esc(e.message)} Check the connection and try again.</p><button id="retry">Retry loading data</button> <a href="https://github.com/LexiLominite/sparkbench">Open the source archive</a></div>`;$('#retry').addEventListener('click',()=>load(true))}}
$('#clear-selection').addEventListener('click',()=>{selected.clear();render()});window.addEventListener('hashchange',()=>{if(DATA){render();window.scrollTo({top:0,behavior:'instant'})}});load();
</script>
