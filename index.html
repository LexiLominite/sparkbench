function modelSpecs(m){const raw=m.raw||{},meta=raw.metadata||{},cp=meta.checkpoint||{},p=profileFor(m),server=meta.server||{};return specs([['Inference engine',m.engine+' '+(server.tensorfold_version||p.version||'')],['Weight format',m.format||raw.format],['Quantization',m.quant],['Total parameters',m.params],['Active parameters',m.active],['Checkpoint',cp.repo_id||meta.inventory_audit?.parameters?.source||p.checkpoint],['Revision / digest',cp.revision||meta.inventory_audit?.checkpoint_revision||m.manifest_digest||raw.digest],['Weight files on disk',val(m.tag_disk_gib,'GiB')],['Weight size basis',m.weight_size_basis],['Compatibility check',meta.compatibility?.status],['Compatibility checked at',meta.compatibility?.checked_at],['Accepted weight methods',meta.compatibility?.accepted_formats?.join(', ')],['Accepted layer algorithms',meta.compatibility?.accepted_quant_algorithms?.join(', ')],['Maximum context',server.context_tokens||p.maximum_context||p.requested_context],['KV cache',server.kv_dtype||p.kv_cache_dtype],['Server slots',server.parallel_slots||p.server_parallel_slots||p.maximum_sequences],['Benchmark concurrency',m.status==='unavailable'?null:server.request_concurrency||1],['MTP drafting',server.mtp_drafts||p.mtp_drafts?`${server.mtp_drafts||p.mtp_drafts} drafts; confidence ${server.mtp_confidence||p.mtp_confidence}`:'Not recorded / not configured'],['Flash attention',p.flash_attention==null?null:String(p.flash_attention)]])}
function resourceSpecs(m){const r=m.resources||{};return specs([['Loaded allocation',val(m.loaded_allocated_gib,'GiB')],['Loaded GPU allocation',val(m.loaded_gpu_allocated_gib,'GiB')],['Host peak unavailable',val(r.host_peak_unavailable_gib,'GiB')],['Peak GPU temperature',val(r.gpu_temperature_max_c,'°C',0)],['Mean GPU power',val(r.gpu_power_mean_w,'W')],['Peak GPU power',val(r.gpu_power_max_w,'W')],['Mean GPU utilization',val(r.gpu_util_mean_percent,'%')],['Resource samples',r.sample_count],['Engine load duration',val(m.load_s,'s',3)],['Startup to ready',val(m.startup_to_ready_s||m.raw?.metadata?.result?.startup_to_ready_s,'s',1)]])}
function rangeTable(r){return `<div class="table-wrap"><table><thead><tr><th>Metric</th><th class="right">Median</th><th class="right">Min</th><th class="right">Max</th><th class="right">Sample SD</th><th class="right">Variation %</th></tr></thead><tbody>${[['Output tok/s','decode_tps'],['First token s','ttft_s'],['Prefill tok/s','prefill_tps'],['End-to-end tok/s','end_to_end_tps']].map(([label,k])=>{const s=r?.metrics?.[k]||{};const d=k==='ttft_s'?3:2;return `<tr><td>${label}</td><td class="right num">${fmt(s.median,d)}</td><td class="right num">${fmt(s.min,d)}</td><td class="right num">${fmt(s.max,d)}</td><td class="right num">${fmt(s.sample_sd,d)}</td><td class="right num">${fmt(s.cv_percent,2)}</td></tr>`}).join('')}</tbody></table></div><p class="small muted" style="margin-top:12px">Three short repetitions describe this sample; they do not establish a confidence interval or sustained thermal stability.</p>`}
function protocolHTML(r,m){const p=r?.protocol||{};const meta=m.raw?.metadata||{};return specs([['Workload',r?.workload||state.workload],['Prompt family',p.prompt_family],['Trial count',r?.trial_count],['Sampling',typeof p.sampling==='object'?JSON.stringify(p.sampling):p.sampling],['Configured context for this workload',p.context_tokens],['Temperature',p.temperature],['Seed',p.seed],['Thinking',p.thinking===false?'Requested off':p.thinking],['Concurrency',p.concurrency],['Timing basis',p.timing_basis||m.decode_measurement],['Source',r?.provenance?.source],['Measured at',r?.provenance?.measured_at],['Protocol match',state.workload==='writing'?meta.protocol_match:null],['Notes',Array.isArray(p.notes)?p.notes.join(' '):p.notes]])}
function workloadTrialTable(r){const a=[...(r.warmup?[{...r.warmup,phase:'warmup'}]:[]),...(r.trials||[])];return `<p class="small muted">These trials belong to the selected workload. Warmup is excluded from its median. Engine-generated reasoning is included when present.</p><div class="table-wrap"><table><thead><tr><th>Trial</th><th class="right">Input tokens</th><th class="right">Output tokens</th><th class="right">Output tok/s</th><th class="right">First token s</th><th class="right">Prefill tok/s</th><th class="right">Wall s</th></tr></thead><tbody>${a.map(t=>`<tr><td>${t.phase==='warmup'?'Warmup (excluded)':'Trial '+esc(t.trial)}</td><td class="right num">${fmt(t.prompt_tokens??t.input_tokens,0)}</td><td class="right num">${fmt(t.output_tokens,0)}</td><td class="right num">${fmt(t.decode_tps,2)}</td><td class="right num">${fmt(t.ttft_s,3)}</td><td class="right num">${fmt(t.prefill_tps,0)}</td><td class="right num">${fmt(t.wall_s,3)}</td></tr>`).join('')}</tbody></table></div>`}
function workloadResources(r){const a=(r.trials||[]).map(t=>t.resource_after).filter(Boolean);if(!a.length)return '';const values=k=>a.map(x=>x[k]).filter(x=>Number.isFinite(x));const maximum=k=>values(k).length?Math.max(...values(k)):null;const average=k=>values(k).length?values(k).reduce((s,x)=>s+x,0)/values(k).length:null;const available=values('memory_available_kib');return `<div class="section"><h2>Selected workload resource samples</h2>${specs([['Sample count',a.length],['Maximum GPU temperature',val(maximum('gpu_temperature_c'),'°C',0)],['Mean sampled GPU power',val(average('gpu_power_w'),'W')],['Maximum sampled GPU power',val(maximum('gpu_power_w'),'W')],['Mean GPU utilization',val(average('gpu_utilization_percent'),'%')],['Minimum available host memory',val(available.length?Math.min(...available)/1024/1024:null,'GiB')]])}<p class="small muted">Samples were taken immediately after each measured request. Available host memory includes all processes; sampled board power is not wall power or total energy.</p></div>`}
function renderDetail(id){const m=models.find(m=>m.id===id);if(!m){content('<div class="empty"><h1>Model not found</h1><p>This link may point to an older snapshot.</p><a class="button" href="#models">Browse models</a></div>');return}const r=measurement(m),meta=m.raw?.metadata||{};const aliases=models.filter(a=>groupKey(a)===groupKey(m));content(`<a class="back" href="#models?workload=${state.workload}">‹ All models</a><div class="intro"><div><h1 class="detail-title">${esc(m.model)}</h1><p class="lede">${esc(m.engine)} / ${esc(m.params)}${m.active?' / '+esc(m.active)+' active':''} / ${esc(m.quant)}</p></div><div class="intro-actions"><button id="detail-select">${selected.has(m.id)?'Remove from comparison':'Add to comparison'}</button><button id="share">Copy link</button></div></div>${m.kind==='generation'?workloadControls():''}${m.status==='incomplete'?`<div class="notice warning">This entry is incomplete. ${esc(m.raw?.error||'No successful generation measurement was published.')}</div>`:!r&&m.kind==='generation'?`<div class="notice warning">${latestAttempt(m)?.status==='error'||latestAttempt(m)?.status==='unavailable'?'The workload test could not produce a valid result. '+esc(latestAttempt(m).error||(latestAttempt(m).protocol?.notes||[]).join(' ')):m.status==='unavailable'?esc(m.raw?.error||'No supported runtime measurement is available.'):state.workload[0].toUpperCase()+state.workload.slice(1)+' has not been measured for this model.'} Select another workload to inspect available results.</div>`:workloadNote()}${m.kind==='generation'?workloadMatrix(m):''}<div class="section-heading detail-selected-heading"><h2>${state.workload[0].toUpperCase()+state.workload.slice(1)} measurement detail</h2><span class="small muted">Select a workload above to inspect its trials and protocol.</span></div>${metricsHTML(m,r)}<div class="two-col"><div><h2>Weight &amp; original server profile</h2>${modelSpecs(m)}${meta.parameters_note?`<p class="small muted" style="margin-top:13px">${esc(meta.parameters_note)}</p>`:''}${aliases.length>1?`<details class="panel"><summary>Shared-weight tags (${aliases.length})</summary><div class="small">${aliases.map(a=>`<a href="${modelURL(a)}">${esc(a.model)}</a>`).join('<br>')}<p class="muted" style="margin-top:12px">These tags have the same recorded engine and checkpoint or manifest digest. Their baseline trials remain individually available.</p></div></details>`:''}</div><div><h2>Writing baseline resources &amp; loading</h2>${resourceSpecs(m)}<p class="small muted" style="margin-top:13px">${esc(m.resources?.note||meta.resources_note||'Host unavailable memory includes the OS and background services. Resource samples are observations, not isolated model memory or full-run energy measurements.')}</p>${meta.result?.startup_note?`<p class="small muted">${esc(meta.result.startup_note)}</p>`:''}</div></div>${r?`<div class="section"><h2>Measurement protocol</h2>${protocolHTML(r,m)}${measurements(m).length>1?`<details class="panel"><summary>All archived measurements for this workload (${measurements(m).length})</summary><div>${measurements(m).map(a=>`<h3>${a.preferred?'Preferred dedicated measurement':'Archival measurement'}: ${fmt(a.metrics?.decode_tps?.median)} tok/s</h3>${protocolHTML(a,m)}`).join('')}</div></details>`:''}</div><details class="panel" open><summary>Statistics &amp; measured range</summary><div>${rangeTable(r)}</div></details>`:''}${r&&state.workload!=='writing'&&r.trials?.length?`<details class="panel"><summary>Selected workload trials &amp; warmup</summary><div>${workloadTrialTable(r)}</div></details>${workloadResources(r)}`:''}${state.workload==='writing'?`<details class="panel"><summary>Individual trials &amp; warmup</summary><div>${trialTable(m)}</div></details>`:''}<p class="small muted" style="margin-top:20px">Speed does not measure answer quality. <a href="#method">Full protocol &amp; limits</a> · <a href="data.json" download>Download archive JSON</a> · <a href="#context">Long-context results</a></p>`);$('#detail-select').onclick=()=>toggleSelection(m.id,!selected.has(m.id));$('#share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);notify('Model link copied')}catch{notify('Copy this page URL from your browser address bar')}};bindWorkload();updateTray()}
function toggleSelection(id,on){if(on&&!selected.has(id)&&selected.size>=8){notify('Select up to eight model entries at once');if($('#results'))renderResults();return}on?selected.add(id):selected.delete(id);updateInPlace()}
function updateTray(){const compare=location.hash.startsWith('#compare');$('#tray').hidden=!selected.size||compare;$('#tray-count').textContent=`${selected.size} model${selected.size===1?'':'s'} selected`;$('#compare-link').href=`#compare?workload=${state.workload}&models=${[...selected].join(',')}`;const count=$('#selected-count');if(count)count.textContent='('+selected.size+')'}
function renderCompare(){const a=models.filter(m=>selected.has(m.id)),ws=visibleWorkloads();content(`<div class="intro"><div><h1>Compare model setups.</h1><p class="lede">Compare every workload together, then inspect latency, storage and runtime details. Measurements retain separate protocols.</p></div><div class="intro-actions"><a class="button" href="#models">Choose models</a>${a.length?'<button id="clear-compare">Clear comparison</button>':''}</div></div>${workloadControls()}${workloadNote()}${a.length?`<div class="table-wrap" id="compare-table-wrap"><table class="compare-table"><thead><tr><th>Measurement</th>${a.map(m=>`<th><a class="model-name" href="${modelURL(m)}">${esc(m.model)}</a><button class="inline" data-remove="${m.id}">Remove</button></th>`).join('')}</tr></thead><tbody>${ws.map(w=>`<tr data-row="workload-${w}"><td>${w[0].toUpperCase()+w.slice(1)}<div class="compare-note">${metricLabels[state.metric]}</div></td>${a.map(m=>`<td class="num">${cellMetric(m,w,Math.max(1,...a.map(m=>measurement(m,w)?.metrics?.[state.metric]?.median||0)))}</td>`).join('')}</tr>`).join('')}${[['Engine',m=>m.engine],['Format',formatOf],['Quantization',m=>m.quant],['Total parameters',m=>m.params],['Active parameters',m=>m.active||'Not recorded'],['Weight files on disk',m=>val(m.diskGiB,'GiB')],['Loaded allocation',m=>val(m.loaded_allocated_gib,'GiB')],['Host peak unavailable',m=>val(m.resources?.host_peak_unavailable_gib,'GiB')],['GPU temperature max',m=>val(m.resources?.gpu_temperature_max_c,'°C',0)],['GPU power mean',m=>val(m.resources?.gpu_power_mean_w,'W')],['Load duration',m=>val(m.load_s,'s',3)],['Startup to ready',m=>val(m.startup_to_ready_s||m.raw?.metadata?.result?.startup_to_ready_s,'s')],['Inspected workload timing',m=>measurement(m)?.protocol?.timing_basis||m.decode_measurement],['Inspected workload protocol',m=>measurement(m)?.protocol?.id||'Not measured']].map(([l,f])=>`<tr data-row="spec-${esc(l)}"><td>${l}</td>${a.map(m=>`<td>${esc(f(m)||'Not recorded')}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted" style="margin-top:16px">Runtime resource rows describe the writing baseline. TensorFold sampled resources came from a follow-up request. Load and startup use different timing windows; inspect model details.</p>`:'<div class="empty"><h2>Select models to begin</h2><p>Select up to eight entries on the Models page. Selected only also gives you a compact table with all three workloads.</p><a class="button primary" href="#models">Browse models</a></div>'}`);const clear=$('#clear-compare');if(clear)clear.onclick=()=>{selected.clear();updateInPlace()};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{selected.delete(b.dataset.remove);updateInPlace()});bindWorkload();updateTray()}
function renderContext(){const rows=WORK.long_context||[];const max=Math.max(1,...rows.map(r=>r.prefill_tps||0));content(`<div class="intro"><div><h1>How long prompts change the wait.</h1><p class="lede">Long-context prefill tests show how quickly a model reads a larger prompt before generating its first token.</p></div><a class="button" href="workloads.json" download>Download workload JSON</a></div><div class="notice warning">These secondary tests use different prompts from the writing baseline. Prefill throughput can include caching effects. A configured context limit does not establish tested context performance.</div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Model / engine</th><th class="right">Prompt tokens</th><th class="right">Prefill tok/s</th><th class="right">First token</th><th>Protocol</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.model_name)}<div class="model-sub">${esc(r.engine)}</div></td><td class="right num">${fmt(r.prompt_tokens,0)}</td><td class="right num"><div class="speed">${fmt(r.prefill_tps,0)}</div><div class="bar" aria-hidden="true"><span style="width:${r.prefill_tps/max*100}%"></span></div></td><td class="right num">${fmt(r.ttft_s,2)} s</td><td class="small muted">${esc(typeof r.protocol==='string'?r.protocol:r.protocol?.id||r.protocol?.prompt_family||'Secondary long-context test')}</td></tr>`).join('')}</tbody></table></div><div class="section text-column"><h2>What this tells you</h2><p class="muted">More prompt tokens usually add time before the first token. Prefill tokens per second describe prompt processing; they do not describe answer generation speed or recall accuracy over a long document.</p>${[...new Set(rows.map(r=>r.model_name))].map(name=>`<details class="panel"><summary>${esc(name)}: provenance &amp; test conditions</summary><div>${rows.filter(r=>r.model_name===name).slice(0,1).map(r=>specs([['Source',r.provenance?.source],['Measured at',r.provenance?.measured_at],['Protocol',typeof r.protocol==='string'?r.protocol:JSON.stringify(r.protocol)],['Measured prompt range',`${nf.format(Math.min(...rows.filter(r=>r.model_name===name).map(r=>r.prompt_tokens)))}–${nf.format(Math.max(...rows.filter(r=>r.model_name===name).map(r=>r.prompt_tokens)))} tokens`]])).join('')}</div></details>`).join('')}</div>`:'<div class="empty"><h2>No long-context results published yet</h2><p>Model context limits are available in each model detail. This view will show actual prompt-length measurements when they are added.</p><a class="button" href="#models">Browse model setups</a></div>'}`);updateTray()}
function renderMethod(){const p=SUM.protocol||{};content(`<div class="intro"><div><h1>The measurement behind the number.</h1><p class="lede">A reproducible speed snapshot, with the limits kept visible. The archive contains model identities, timing statistics, warmup trials and resource observations.</p></div><div class="intro-actions"><a class="button" href="data.json" download>Archive JSON</a><a class="button" href="summary.json" download>Summary JSON</a><a class="button" href="workloads.json" download>Workloads JSON</a></div></div><div class="method-grid"><h2>Hardware snapshot</h2><div>${specs(Object.entries(SUM.hardware||{}).map(([k,v])=>[k.replaceAll('_',' '),v]))}</div></div><div class="method-grid"><h2>Writing baseline</h2><div><p>One warmup capped at ${esc(p.warmup_output_limit)} output tokens, followed by ${esc(p.measured_trials)} measured trials capped at ${esc(p.measured_output_limit)} tokens. The displayed number is the measured median; the warmup is excluded.</p>${specs([['Temperature',p.temperature],['Thinking',p.thinking===false?'Requested off':p.thinking],['Concurrency',p.concurrency],['Seed',p.seed],['Default requested context',p.context_tokens],['Sample limits',p.sample_limits],['Prompt caching',p.prompt_cache],['Token counting',p.generated_tokens]])}</div></div><div class="method-grid"><h2>Engine timing</h2><div>${Object.entries(p.decode_basis||{}).map(([engine,basis])=>`<div class="engine-profile"><strong>${esc(engine)}</strong><p>${esc(basis)}</p></div>`).join('')}<p>${esc(p.configuration_caveat)}</p><details class="panel"><summary>Complete engine profiles</summary><div>${Object.entries(p.engine_profiles||{}).map(([name,profile])=>`<h3 style="margin-top:15px">${esc(name.replaceAll('_',' '))}</h3>${specs(Object.entries(profile).map(([k,v])=>[k.replaceAll('_',' '),typeof v==='object'?JSON.stringify(v):v]))}`).join('')}</div></details></div></div><div class="method-grid"><h2>Coding &amp; chat</h2><div><p>Dedicated workload results are stored separately from the shared writing benchmark. Each result records model, inference engine, workload, metrics, protocol and source. The displayed speeds describe their own prompts and sampling; missing fields are shown as not recorded.</p><p>Archived Qwen3.8-Flash-Next coding and chat observations came from a separate prompt suite. New results marked Dedicated workload use the controlled coding/chat protocol: a 16-token warmup followed by three measured requests capped at 256 tokens, temperature 0, thinking requested off, and concurrency 1. Neither set replaces the original writing median. Alias labels such as “coder” identify an installed tag, not a measured coding workload.</p><p>These measurements do not test program correctness, pass rates, answer quality, vision or tool use.</p>${(WORK.profiles||[]).map(x=>`<h3>${esc(x.label)}</h3><p>${esc(x.description)}</p>`).join('')}</div></div><div class="method-grid"><h2>Load &amp; resources</h2><div><p>${esc(p.warmup_basis)}</p><p>${esc(p.load_caveat)}</p><p>Loaded allocation and host peak unavailable memory use different scopes. Host values include the OS and background services; they cannot be read as isolated model RAM. GPU power is sampled, not full-run energy. TensorFold power and temperature observations came from a follow-up generation, and its first-container startup included one-time kernel compilation.</p></div></div><div class="method-grid"><h2>Interpretation limits</h2><div><p>${esc(p.scope)}</p><p>Different tokenizers count text differently. A small fast model is not automatically a better coding model. Do not interpret the table order as a quality recommendation, and do not treat the engine timing formulas as interchangeable.</p><p>Matching recorded digests are grouped within the same engine for browsing. Ollama digests identify manifests; tags with different manifests are not collapsed even if they reuse a weight blob. Each alias retains its own measured trials and can be compared individually.</p></div></div><div class="method-grid"><h2>Data &amp; publication</h2><div><p>This is a static GitHub Pages snapshot. Reload fetches the published files again; it does not launch benchmarks. Prompt and answer text are omitted from the public archive.</p><p><a href="BENCHMARK.md">Read the stored benchmark protocol</a> · <a href="https://github.com/LexiLominite/sparkbench">Inspect repository history</a></p></div></div>`);updateTray()}
function decodeModelId(id){try{return decodeURIComponent(id)}catch{return id}}
function route(){const hash=location.hash.slice(1)||'models', [path,search='']=hash.split('?'),params=new URLSearchParams(search);if(workloads.includes(params.get('workload')))state.workload=params.get('workload');if(path==='models'){if(['all','single'].includes(params.get('view')))state.view=params.get('view');if(['all','selected'].includes(params.get('scope')))state.scope=params.get('scope')}if(path==='compare'&&params.has('models'))selected=new Set([...new Set((params.get('models')||'').split(',').filter(id=>models.some(m=>m.id===id)))].slice(0,8));return path}
function render(inPlace=false){const path=inPlace?(location.hash.slice(1)||'models').split('?')[0]:route();document.querySelectorAll('[data-nav]').forEach(a=>{a.removeAttribute('aria-current');if(a.dataset.nav===(path.startsWith('model/')?'models':path))a.setAttribute('aria-current','page')});if(path.startsWith('model/'))renderDetail(decodeModelId(path.slice(6)));else if(path==='compare')renderCompare();else if(path==='context')renderContext();else if(path==='method')renderMethod();else renderModels();document.title=(path.startsWith('model/')?models.find(m=>m.id===decodeModelId(path.slice(6)))?.model||'Model':path==='compare'?'Compare models':path==='context'?'Long context':path==='method'?'Measurement method':'Model performance')+' — SparkBench'}
function csvEscape(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function exportCSV(){const header=['model','engine','workload','quantization','format','total_parameters_B','active_parameters_B','weight_disk_GiB','model_status','workload_status','workload_note','trial_count','output_tps_median','ttft_s_median','prefill_tps_median','end_to_end_tps_median','timing_basis','protocol_id','source'];const rows=filterModels().flatMap(m=>visibleWorkloads().map(w=>{const r=measurement(m,w),attempt=latestAttempt(m,w),status=r?'ok':attempt?.status||(m.status==='unavailable'?'unavailable':'unmeasured');return [m.model,m.engine,w,m.quant,formatOf(m),m.totalB,m.activeB,m.diskGiB,m.status,status,r?'':attempt?.error||'',r?.trial_count,...metricKeys.map(k=>r?.metrics[k]?.median),r?(r.protocol?.timing_basis||m.decode_measurement):'',r?.protocol?.id,r?.provenance?.source]}));const blob=new Blob([[header,...rows].map(a=>a.map(csvEscape).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`sparkbench-${state.view==='all'?'all-workloads':state.workload}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('CSV exported for visible models and workloads')}
async function load(reload=false){try{const suffix=reload?'?refresh='+Date.now():'';const responses=await Promise.all(['data.json','summary.json','workloads.json'].map(f=>fetch(f+suffix,{cache:reload?'reload':'default'})));if(!responses[0].ok||!responses[1].ok)throw new Error('Published data files could not be loaded.');[DATA,SUM]=await Promise.all(responses.slice(0,2).map(r=>r.json()));WORK=responses[2].ok?await responses[2].json():{results:[],long_context:[],profiles:[]};buildModels();restorePreferences();selected=new Set([...selected].filter(id=>models.some(m=>m.id===id)));const updated=WORK.updated_utc||DATA.archive_updated_utc;$('#header-meta').textContent='NVIDIA GB10 / '+(updated?new Date(updated).toLocaleDateString('en',{year:'numeric',month:'short',day:'numeric',timeZone:'UTC'}):'Measured snapshot');$('#footer-meta').textContent=`${models.length} model and engine configurations archived. Speed does not measure answer quality.`;render();if(reload)notify('Published measurements reloaded')}catch(e){content(`<div class="error"><h1>Measurements could not load.</h1><p class="muted">${esc(e.message)} Check the connection and try again.</p><button id="retry">Retry loading data</button> <a href="https://github.com/LexiLominite/sparkbench">Open the source archive</a></div>`);$('#retry').onclick=()=>load(true)}}
$('#clear-selection').onclick=()=>{selected.clear();updateInPlace()};window.addEventListener('hashchange',()=>{if(DATA){openPanels.clear();render();persistPreferences();window.scrollTo({top:0,behavior:'instant'})}});load();
</script>
